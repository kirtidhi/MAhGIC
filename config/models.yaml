# Which model does which job. The pipeline is Python-first: stages 1–4
# (universe, screen, fetch, analyse) use no LLM at all.
#
# Routing rule: every task runs on the local model unless it is listed under
# `escalate`. Claude is used only for the final review of the best names per
# track, or when the local model fails validation twice.

providers:
  ollama:
    base_url: http://localhost:11434
    # Kirti's Mac: 14" MacBook Pro, M5, 16 GB (~12 GB usable for models).
    # Primary: Qwen 3.5 9B (~7 GB). Fallback: Gemma 4 E4B (~3 GB).
    # Confirm the exact tags on ollama.com/library before pulling.
    model: qwen3.5:9b
    fallback_model: gemma4:e4b
    # 16k fits a 9B model in 16 GB. Prompts are budgeted to stay under it
    # (rules ~6k tokens + facts <=7k + answer ~2k).
    num_ctx: 16384
    temperature: 0.2
    timeout_s: 900
  mlx:
    # Alternative local server: `mlx_lm.server --model <hf-model>` (OpenAI-compatible).
    # Faster prompt processing on M5. Route a task to it by setting it to "mlx" below.
    base_url: http://localhost:8080/v1
    model: mlx-community/Qwen3.5-9B-4bit
    num_ctx: 16384
    timeout_s: 900
  anthropic:
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 8000
  gemini:
    model: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
  openai:
    model: gpt-4o
    api_key_env: OPENAI_API_KEY

tasks:
  extract_filing: ollama     # map step: pull facts out of 10-K / annual report chunks
  summarise_jobs: ollama     # B2: classify postings into strategic themes
  draft_thesis: ollama       # B6 section scores + narrative, as JSON
  review_thesis: anthropic   # second read of the top names only

escalate:
  # Send to the review provider when the local draft fails JSON validation twice.
  on_invalid_json: true
  # Review only the best N per track per market (Claude cost control).
  review_top_n_per_track: 3

# Hard ceiling on paid calls per run. 0 disables paid providers entirely.
max_paid_calls_per_run: 12
