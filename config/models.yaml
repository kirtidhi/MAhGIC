# Which model does which job. The pipeline is Python-first: stages 1–4
# (universe, screen, fetch, analyse) use no LLM at all.
#
# Routing rule: every task runs on the local model unless it is listed under
# `escalate`. Claude is used only for the final review of the best names per
# track, or when the local model fails validation twice.

providers:
  # Two local models with different jobs (measured on the 16 GB M5, Oct 2026):
  # - ollama:      Qwen 3.5 9B @24k writes the drafts. At 16k its thinking filled the
  #                context and no answer came back; at 24k drafts are valid (~5-6 min each).
  # - ollama_fast: Gemma 4 E4B @16k reads filing chunks and results releases
  #                (~25 s per chunk, ~10x faster than Qwen at similar quality for extraction).
  # Any provider with `impl: ollama` talks to the same Ollama server.
  ollama:
    impl: ollama
    base_url: http://localhost:11434
    model: qwen3.5:9b-q4_K_M
    num_ctx: 24576
    temperature: 0.2
    timeout_s: 2400
    # Thinking on: time is not a constraint, judgement quality is.
    think: true
  ollama_fast:
    impl: ollama
    base_url: http://localhost:11434
    model: gemma4:e4b-it-q4_K_M
    num_ctx: 16384
    temperature: 0.2
    timeout_s: 900
    think: true
  mlx:
    # Alternative local server: `mlx_lm.server --model <hf-model>` (OpenAI-compatible).
    # Faster prompt processing on M5. Route a task to it by setting it to "mlx" below.
    base_url: http://localhost:8080/v1
    model: mlx-community/Qwen3.5-9B-4bit
    num_ctx: 16384
    timeout_s: 900
  anthropic:
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 8000
  gemini:
    model: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
  openai:
    model: gpt-4o
    api_key_env: OPENAI_API_KEY

tasks:
  extract_filing: ollama_fast    # map step: pull facts out of 10-K / 10-Q / 20-F chunks
  extract_guidance: ollama_fast  # guidance history from results releases / ASX announcements
  summarise_jobs: ollama_fast    # B2: classify postings into strategic themes
  draft_thesis: ollama           # B6 section scores + narrative, as JSON
  review_thesis: anthropic   # second read of the top names only

escalate:
  # Send to the review provider when the local draft fails JSON validation twice.
  # Off: the run stays fully local; failures are logged and saved as draft_error.
  on_invalid_json: false
  # Review only the best N per track per market (Claude cost control).
  review_top_n_per_track: 3

# When a local call runs out of context (thinking + answer > num_ctx):
# 1) retry once with an instruction to keep the reasoning short,
# 2) then once more with a bigger context (Qwen 9B: ~+0.3 GB per extra 8k tokens).
overflow:
  concise_retry: true
  retry_num_ctx: 32768

# Seconds to wait after unloading one local model before the next one loads
# (free memory dipped to 4% once when Gemma and Qwen overlapped on 16 GB).
model_switch_pause_s: 5

# Hard ceiling on paid calls per run. 0 disables paid providers entirely (fully local).
max_paid_calls_per_run: 0
