# Machine-readable copy of playbook.md B6 and the Phase 0 screen.
# The playbook is the source of truth; change both together.

phase0:
  survival_net_debt_ebitda_max: 2.0
  fcf_max_yoy_fall: 0.50
  curable_dip_min_drawdown: 0.25
  insider_min_pct: 5.0
  forward_pe: [0, 25]
  deep_drawdown_checklist: 0.70
  financial_industries: [bank, insurance, capital markets, asset management, mortgage, credit services]
  cyclical_sectors: [Energy, Basic Materials]
  # Industries outside those sectors that are just as cyclical (VGN Oct 2026: an airline at ~4.5x peak earnings)
  cyclical_industries: [airlines, auto manufacturers, residential construction, marine shipping, travel services]

weights:          # sum to 10
  three_q:
    business: 1.0
    management: 1.0
    balance_sheet: 1.0
  financials: 2.5
  macro: 1.0
  strategic_intent: 1.5
  leadership: 1.0
  regulatory: 1.0

caps:             # lowest triggered cap wins
  going_concern: 2
  auditor_resignation_or_qualified: 3
  pledge_over_50: 3
  pledge_25_50_or_rising: 4
  ocf_below_ni_and_receivables_over_120: 4
  guidance_misses_2plus: 5
  dilution_over_5pct: 5
  # Banks/insurers: return on price (ROE / price-to-book) below the local 10y bond (Oct 2026:
  # CBA ~4.2%, ANZ ~5.0% vs 5.22%). The model scored CBA and ANZ 10/10 raw without bank data.
  financial_return_below_bond: 5

# Tracks (playbook B1 v1.2). Hidden gem = passes 2+ "less known" tests; Fallen quality = fails
# 2+ AND is at least 30% below its 52-week high; large companies that have not fallen are
# labelled "large" (no setup). Media coverage (the 4th test) is not available to the code.
tracks:
  size_max: {USD: 5000000000, AUD: 5000000000, INR: 250000000000}
  analysts_max: {us: 8, asx: 5, india: 5}
  # Index test: ASX 100 approximated by the 100 largest in the ASX 200 universe; for US
  # universes drawn from the S&P 500 every company is a member (fails the test).
  index_top_n: {asx: 100, india: 100}
  index_member_universes: [sp500, us_top100]
  fallen_min_drawdown: 0.30

# Industries never analysed (Kirti, 26 Oct 2026: does not invest in airlines)
exclude_industries: [airlines]

hypothetical_8:   # all five needed for 8+, otherwise cap 7
  max_mid_cycle_pe: 15
  min_insider_pct: 10
  # Yahoo's "insiders" includes parent companies and strategic holders (REA: News Corp ~61%).
  # Above this, the stake does not count as founder skin until B5 verifies who holds it.
  parent_suspect_pct: 50
  required: [moat, valuation, curable_negative, net_cash_and_cash_real, insider_skin]

flags:
  # SBC above this share of revenue: valuation uses FCF after SBC (US software, Oct 2026 run)
  sbc_material_pct: 0.05
  # Cyclicals (phase0.cyclical_sectors): latest EPS this many times the 5-year median = peak earnings
  peak_eps_ratio: 1.5
  # Banks/insurers pass the A6 price test when ROE / price-to-book beats the 10y by this many points
  financial_equity_premium_pct: 2.0
  receivable_days_max: 120
  roic_min: 0.10
  dilution_flag_pct: 3.0
